name: Deploy VitePress to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build VitePress
        run: npm run docs:build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Diagnose dist size
        run: |
          du -sh docs/.vitepress/dist
          echo '--- top dirs ---'
          du -sh docs/.vitepress/dist/* | sort -rh | head -20
          echo '--- total files ---'
          find docs/.vitepress/dist -type f | wc -l
          echo '--- html count ---'
          find docs/.vitepress/dist -name '*.html' | wc -l
          echo '--- sample html sizes ---'
          find docs/.vitepress/dist -name '*.html' -size +100k | head -5 | xargs ls -la
          echo '--- assets size ---'
          du -sh docs/.vitepress/dist/assets 2>/dev/null || echo 'no assets'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
