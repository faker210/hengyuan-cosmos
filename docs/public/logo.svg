<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- 外圈 -->
  <circle cx="100" cy="100" r="90" stroke="url(#g1)" stroke-width="2" fill="url(#g2)" opacity="0.6"/>
  <circle cx="100" cy="100" r="75" stroke="url(#g1)" stroke-width="1" fill="none" opacity="0.4"/>
  <!-- 锚点核心 -->
  <circle cx="100" cy="100" r="20" fill="url(#g1)"/>
  <circle cx="100" cy="100" r="12" fill="#fff" opacity="0.9"/>
  <!-- 六道共生射线 -->
  <line x1="100" y1="80" x2="100" y2="30" stroke="url(#g1)" stroke-width="2" opacity="0.7"/>
  <line x1="100" y1="120" x2="100" y2="170" stroke="url(#g1)" stroke-width="2" opacity="0.7"/>
  <line x1="80" y1="100" x2="30" y2="100" stroke="url(#g1)" stroke-width="2" opacity="0.7"/>
  <line x1="120" y1="100" x2="170" y2="100" stroke="url(#g1)" stroke-width="2" opacity="0.7"/>
  <line x1="86" y1="86" x2="50" y2="50" stroke="url(#g1)" stroke-width="2" opacity="0.5"/>
  <line x1="114" y1="114" x2="150" y2="150" stroke="url(#g1)" stroke-width="2" opacity="0.5"/>
  <line x1="114" y1="86" x2="150" y2="50" stroke="url(#g1)" stroke-width="2" opacity="0.5"/>
  <line x1="86" y1="114" x2="50" y2="150" stroke="url(#g1)" stroke-width="2" opacity="0.5"/>
  <!-- 万族节点 -->
  <circle cx="100" cy="30" r="5" fill="url(#g1)"/>
  <circle cx="100" cy="170" r="5" fill="url(#g1)"/>
  <circle cx="30" cy="100" r="5" fill="url(#g1)"/>
  <circle cx="170" cy="100" r="5" fill="url(#g1)"/>
  <circle cx="50" cy="50" r="4" fill="url(#g1)" opacity="0.7"/>
  <circle cx="150" cy="50" r="4" fill="url(#g1)" opacity="0.7"/>
  <circle cx="50" cy="150" r="4" fill="url(#g1)" opacity="0.7"/>
  <circle cx="150" cy="150" r="4" fill="url(#g1)" opacity="0.7"/>
</svg>
