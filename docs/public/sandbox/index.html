, "peak_population_round": "1", "final_tech_level": "7151.6231", "final_stability": "0.1426", "avg_stability": "0.8389", "avg_happiness": "0.8145", "total_conflicts": "0", "final_env_degradation": "0.0", "final_knowledge": "310563.0", "survived_500_rounds": "0", "collapse_round": "484"}]};
const COLORS = {
  '掠夺文明': { border: '#ef4444', bg: 'rgba(239,68,68,0.1)' },
  '锚点共生文明': { border: '#22c55e', bg: 'rgba(34,197,94,0.1)' }
};
let charts = {};

function filterScenarios() {
  const civ = document.getElementById('civType').value;
  const pop = document.getElementById('popLevel').value;
  const env = document.getElementById('envType').value;
  return DATA.scenarios.filter(s =>
    (civ === 'all' || s.type === civ) &&
    (pop === 'all' || s.pop_level === pop) &&
    (env === 'all' || s.environment === env)
  );
}

function populateSelect(selectId, scenarios) {
  const sel = document.getElementById(selectId);
  const prev = sel.value;
  sel.innerHTML = '';
  scenarios.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.textContent = `${s.id} ${s.type} | ${s.pop_level} | ${s.environment}`;
    sel.appendChild(opt);
  });
  if (prev && [...sel.options].some(o => o.value === prev)) sel.value = prev;
}

function getScenarioById(id) {
  return DATA.scenarios.find(s => s.id === id);
}

function renderStats(scenario) {
  const sum = DATA.summary.find(s => s.scenario_id === scenario.id);
  const grid = document.getElementById('statsGrid');
  const civClass = scenario.type === '掠夺文明' ? 'predatory' : 'anchor';
  grid.innerHTML = `
    <div class="stat-card"><div class="label">文明类型</div><div class="value ${civClass === 'predatory' ? 'red' : 'green'}">${scenario.type}</div></div>
    <div class="stat-card"><div class="label">终局人口</div><div class="value blue">${Number(sum.final_population).toLocaleString()}万</div></div>
    <div class="stat-card"><div class="label">峰值人口</div><div class="value purple">${Number(sum.peak_population).toLocaleString()}万</div></div>
    <div class="stat-card"><div class="label">平均稳定性</div><div class="value amber">${(sum.avg_stability*100).toFixed(1)}%</div></div>
    <div class="stat-card"><div class="label">平均幸福度</div><div class="value green">${(sum.avg_happiness*100).toFixed(1)}%</div></div>
    <div class="stat-card"><div class="label">累计冲突</div><div class="value red">${sum.total_conflicts}次</div></div>
    <div class="stat-card"><div class="label">终局科技</div><div class="value blue">Lv.${Number(sum.final_tech_level).toFixed(1)}</div></div>
    <div class="stat-card"><div class="label">存续状态</div><div class="value ${sum.survived_500_rounds==1?'green':'red'}">${sum.survived_500_rounds==1?'存续':'崩溃(R'+sum.collapse_round+')'}</div></div>
  `;
}

function createChart(canvasId, label, dataKey, scenario, scenario2) {
  const ctx = document.getElementById(canvasId);
  if (charts[canvasId]) charts[canvasId].destroy();
  const datasets = [{
    label: `${scenario.type} (${scenario.id})`,
    data: scenario.rounds.map(r => r[dataKey]),
    borderColor: COLORS[scenario.type].border,
    backgroundColor: COLORS[scenario.type].bg,
    fill: true,
    tension: 0.3,
    pointRadius: 0,
    borderWidth: 2
  }];
  if (scenario2) {
    datasets.push({
      label: `${scenario2.type} (${scenario2.id})`,
      data: scenario2.rounds.map(r => r[dataKey]),
      borderColor: scenario2.type === '掠夺文明' ? '#f59e0b' : '#0ea5e9',
      backgroundColor: 'transparent',
      fill: false,
      tension: 0.3,
      pointRadius: 0,
      borderWidth: 2,
      borderDash: [5,5]
    });
  }
  charts[canvasId] = new Chart(ctx, {
    type: 'line',
    data: { labels: scenario.rounds.map(r => 'R'+r.round), datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { intersect: false, mode: 'index' },
      plugins: { legend: { labels: { color: '#94a3b8', font: {size: 11} } } },
      scales: {
        x: { ticks: { color: '#475569', maxTicksLimit: 10 }, grid: { color: '#1e293b' } },
        y: { ticks: { color: '#475569' }, grid: { color: '#1e293b' } }
      }
    }
  });
}

function renderCharts(scenario, scenario2) {
  const grid = document.getElementById('chartsGrid');
  const chartDefs = [
    ['chartPop', '👥 人口演化（万）', 'population', '#0ea5e9'],
    ['chartStab', '⚖️ 稳定性指数', 'stability', '#22c55e'],
    ['chartHappy', '😊 幸福度指数', 'happiness', '#a855f7'],
    ['chartTech', '🔬 科技等级', 'tech', '#0ea5e9'],
    ['chartEnv', '🌍 环境破坏度', 'env_deg', '#f59e0b'],
    ['chartConf', '⚔️ 累计冲突次数', 'conflicts', '#ef4444'],
  ];
  grid.innerHTML = chartDefs.map(([id,title,key,color]) => `
    <div class="chart-card">
      <h4><span class="dot" style="background:${color}"></span>${title}</h4>
      <div class="chart-container"><canvas id="${id}"></canvas></div>
    </div>
  `).join('');
  chartDefs.forEach(([id,title,key]) => createChart(id, title, key, scenario, scenario2));
}

function renderTable() {
  const tbody = document.querySelector('#summaryTable tbody');
  tbody.innerHTML = DATA.summary.map(s => `
    <tr>
      <td>${s.scenario_id}</td>
      <td><span class="badge ${s.civilization_type==='掠夺文明'?'predatory':'anchor'}">${s.civilization_type}</span></td>
      <td>${s.population_level}</td>
      <td>${s.environment}</td>
      <td>${Number(s.final_population).toLocaleString()}</td>
      <td>${Number(s.peak_population).toLocaleString()}</td>
      <td>${(s.avg_stability*100).toFixed(1)}%</td>
      <td>${(s.avg_happiness*100).toFixed(1)}%</td>
      <td>${s.total_conflicts}</td>
      <td>${(s.final_env_degradation*100).toFixed(0)}%</td>
      <td><span class="badge ${s.survived_500_rounds==1?'alive':'collapsed'}">${s.survived_500_rounds==1?'存续':'崩溃'}</span></td>
    </tr>
  `).join('');
}

function update() {
  const filtered = filterScenarios();
  populateSelect('scenarioSelect', filtered);
  populateSelect('scenarioSelect2', filtered);
  const s1 = getScenarioById(document.getElementById('scenarioSelect').value);
  const compareMode = document.getElementById('compareMode').checked;
  const s2 = compareMode ? getScenarioById(document.getElementById('scenarioSelect2').value) : null;
  if (s1) {
    renderStats(s1);
    renderCharts(s1, s2);
  }
}

document.getElementById('civType').addEventListener('change', update);
document.getElementById('popLevel').addEventListener('change', update);
document.getElementById('envType').addEventListener('change', update);
document.getElementById('scenarioSelect').addEventListener('change', update);
document.getElementById('scenarioSelect2').addEventListener('change', update);
document.getElementById('compareMode').addEventListener('change', function() {
  document.getElementById('compareGroup').style.display = this.checked ? 'flex' : 'none';
  update();
});

// init
update();
renderTable();
</script>
