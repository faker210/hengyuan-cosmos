<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>衡元宙 · 翻译任务进度看板 | Translation Dashboard</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
.header { background: linear-gradient(135deg, #0c1929 0%, #1e1b4b 50%, #0c1929 100%); padding: 32px 24px; text-align: center; border-bottom: 1px solid #1e293b; }
.header h1 { font-size: 28px; background: linear-gradient(120deg, #0ea5e9, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
.header p { color: #94a3b8; font-size: 14px; }
.container { max-width: 1200px; margin: 0 auto; padding: 24px; }
.overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 32px; }
.ov-card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; text-align: center; }
.ov-card .num { font-size: 32px; font-weight: 700; }
.ov-card .lbl { font-size: 12px; color: #64748b; margin-top: 4px; }
.ov-card .num.blue { color: #0ea5e9; }
.ov-card .num.green { color: #22c55e; }
.ov-card .num.amber { color: #f59e0b; }
.ov-card .num.purple { color: #a855f7; }
.ov-card .num.red { color: #ef4444; }
.section { background: #1e293b; border-radius: 12px; padding: 24px; margin-bottom: 24px; border: 1px solid #334155; }
.section h3 { color: #0ea5e9; margin-bottom: 20px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.lang-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.lang-card { background: #0f172a; border-radius: 10px; padding: 16px; border: 1px solid #1e293b; }
.lang-card .lang-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.lang-card .flag { font-size: 20px; }
.lang-card .lang-name { font-weight: 600; color: #e2e8f0; }
.lang-card .pct { font-size: 14px; font-weight: 700; }
.progress-bar { height: 8px; background: #1e293b; border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
.progress-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
.lang-card .meta { font-size: 11px; color: #64748b; display: flex; justify-content: space-between; }
.doc-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.doc-table th { text-align: left; padding: 10px 12px; color: #64748b; border-bottom: 1px solid #334155; font-weight: 600; }
.doc-table td { padding: 10px 12px; border-bottom: 1px solid #1e293b; color: #cbd5e1; }
.doc-table tr:hover { background: #0f172a; }
.status-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.status-done { background: rgba(34,197,94,0.15); color: #4ade80; }
.status-doing { background: rgba(245,158,11,0.15); color: #fbbf24; }
.status-pending { background: rgba(100,116,139,0.15); color: #94a3b8; }
.timeline { display: flex; gap: 0; margin: 20px 0; }
.tl-item { flex: 1; text-align: center; position: relative; }
.tl-item::before { content: ''; position: absolute; top: 12px; left: 0; right: 0; height: 2px; background: #334155; z-index: 0; }
.tl-item:first-child::before { left: 50%; }
.tl-item:last-child::before { right: 50%; }
.tl-dot { width: 24px; height: 24px; border-radius: 50%; margin: 0 auto 8px; position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; }
.tl-dot.done { background: #22c55e; color: white; }
.tl-dot.doing { background: #f59e0b; color: white; animation: pulse 1.5s infinite; }
.tl-dot.pending { background: #334155; color: #64748b; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(245,158,11,0.4); } 50% { box-shadow: 0 0 0 8px rgba(245,158,11,0); } }
.tl-label { font-size: 11px; color: #94a3b8; }
.footer { text-align: center; padding: 32px; color: #475569; font-size: 12px; border-top: 1px solid #1e293b; margin-top: 40px; }
</style>
</head>
<body>
<div class="header">
  <h1>衡元宙 · 翻译任务进度看板</h1>
  <p>文档 30–39 · 8语种翻译 · 项目1持续运行中</p>
</div>
<div class="container">
  <div class="overview">
    <div class="ov-card"><div class="num blue">10</div><div class="lbl">待翻译文档</div></div>
    <div class="ov-card"><div class="num green">8</div><div class="lbl">目标语种</div></div>
    <div class="ov-card"><div class="num amber">80</div><div class="lbl">总翻译任务</div></div>
    <div class="ov-card"><div class="num purple">42%</div><div class="lbl">整体进度</div></div>
    <div class="ov-card"><div class="num red">3</div><div class="lbl">进行中</div></div>
  </div>

  <div class="section">
    <h3>🌍 各语种翻译进度</h3>
    <div class="lang-grid" id="langGrid"></div>
  </div>

  <div class="section">
    <h3>📄 文档翻译状态（文档30–39）</h3>
    <table class="doc-table">
      <thead><tr><th>文档编号</th><th>文档名称</th><th>字数</th><th>已完成语种</th><th>进度</th><th>状态</th></tr></thead>
      <tbody id="docTable"></tbody>
    </table>
  </div>

  <div class="section">
    <h3>📈 翻译流程时间线</h3>
    <div class="timeline">
      <div class="tl-item"><div class="tl-dot done">✓</div><div class="tl-label">原文定稿</div></div>
      <div class="tl-item"><div class="tl-dot done">✓</div><div class="tl-label">术语库对齐</div></div>
      <div class="tl-item"><div class="tl-dot doing">⚡</div><div class="tl-label">批量翻译</div></div>
      <div class="tl-item"><div class="tl-dot pending">4</div><div class="tl-label">人工校对</div></div>
      <div class="tl-item"><div class="tl-dot pending">5</div><div class="tl-label">多语种审校</div></div>
      <div class="tl-item"><div class="tl-dot pending">6</div><div class="tl-label">发布上线</div></div>
    </div>
  </div>
</div>
<div class="footer">衡元宙 · 锚点共生文明 · 翻译任务进度看板 · 项目1持续运行中</div>

<script>
const languages = [
  { code: 'en', name: 'English', flag: '🇺🇸', pct: 65, done: 7, total: 10 },
  { code: 'ja', name: '日本語', flag: '🇯🇵', pct: 55, done: 6, total: 10 },
  { code: 'ko', name: '한국어', flag: '🇰🇷', pct: 48, done: 5, total: 10 },
  { code: 'zh-TW', name: '繁體中文', flag: '🇭🇰', pct: 80, done: 8, total: 10 },
  { code: 'es', name: 'Español', flag: '🇪🇸', pct: 35, done: 4, total: 10 },
  { code: 'fr', name: 'Français', flag: '🇫🇷', pct: 30, done: 3, total: 10 },
  { code: 'de', name: 'Deutsch', flag: '🇩🇪', pct: 25, done: 3, total: 10 },
  { code: 'ru', name: 'Русский', flag: '🇷🇺', pct: 20, done: 2, total: 10 },
];

const docs = [
  { id: '30', name: '五种共生文明分型总览', words: 8200, done: 6, status: 'doing' },
  { id: '31', name: '东亚集约型文明', words: 6500, done: 5, status: 'doing' },
  { id: '32', name: '北欧福利型文明', words: 5800, done: 4, status: 'doing' },
  { id: '33', name: '北美多元型文明', words: 7100, done: 3, status: 'pending' },
  { id: '34', name: '欧洲大陆社会型文明', words: 6900, done: 3, status: 'pending' },
  { id: '35', name: '发展中赶超型文明', words: 6200, done: 2, status: 'pending' },
  { id: '36', name: '社会结构与阶层流动', words: 7500, done: 2, status: 'pending' },
  { id: '37', name: '共生教育体系', words: 5400, done: 1, status: 'pending' },
  { id: '38', name: '共生医疗体系', words: 5100, done: 1, status: 'pending' },
  { id: '39', name: '住房与环境保障', words: 4800, done: 0, status: 'pending' },
];

const colors = ['#0ea5e9','#22c55e','#f59e0b','#a855f7','#ef4444','#06b6d4','#84cc16','#f97316'];

document.getElementById('langGrid').innerHTML = languages.map((l,i) => `
  <div class="lang-card">
    <div class="lang-head">
      <span><span class="flag">${l.flag}</span> <span class="lang-name">${l.name}</span></span>
      <span class="pct" style="color:${colors[i]}">${l.pct}%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${l.pct}%;background:${colors[i]}"></div></div>
    <div class="meta"><span>${l.done}/${l.total} 文档</span><span>${l.code.toUpperCase()}</span></div>
  </div>
`).join('');

document.getElementById('docTable').innerHTML = docs.map(d => `
  <tr>
    <td>文档${d.id}</td>
    <td>${d.name}</td>
    <td>${d.words.toLocaleString()}</td>
    <td>${d.done}/8</td>
    <td>
      <div class="progress-bar" style="width:120px;display:inline-block;vertical-align:middle">
        <div class="progress-fill" style="width:${d.done/8*100}%;background:${d.status==='done'?'#22c55e':d.status==='doing'?'#f59e0b':'#334155'}"></div>
      </div>
      <span style="margin-left:8px;font-size:12px;color:#64748b">${Math.round(d.done/8*100)}%</span>
    </td>
    <td><span class="status-badge status-${d.status}">${d.status==='done'?'已完成':d.status==='doing'?'翻译中':'待开始'}</span></td>
  </tr>
`).join('');
</script>
</body>
</html>
